name: Bump version and tag

# Runs on every push to master, bumps the patch number in SexyInterrupter.toc
# (## Version:) and settings.lua's GetAddOnMetadata fallback, commits that,
# and creates a matching git tag. Guarded by `github.actor` so the bump
# commit it pushes (authored as github-actions[bot]) doesn't retrigger this
# same workflow in an infinite loop.
on:
  push:
    branches:
      - master

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version
        id: bump
        run: |
          current=$(grep -oP '(?<=## Version: )[0-9]+\.[0-9]+\.[0-9]+' SexyInterrupter.toc)

          if [ -z "$current" ]; then
            echo "Could not find a ## Version: X.Y.Z line in SexyInterrupter.toc" >&2
            exit 1
          fi

          IFS='.' read -r major minor patch <<< "$current"
          patch=$((patch + 1))
          new="$major.$minor.$patch"

          sed -i "s/## Version: .*/## Version: $new/" SexyInterrupter.toc
          sed -i "s/\(SI\.Version = GetSIAddOnMetadata(\"SexyInterrupter\", \"Version\") or \"\)[0-9.]*\(\"\)/\1$new\2/" settings.lua

          echo "new_version=$new" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add SexyInterrupter.toc settings.lua
          git commit -m "Bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          git tag "${{ steps.bump.outputs.new_version }}"
          git push origin HEAD:master
          git push origin "${{ steps.bump.outputs.new_version }}"
